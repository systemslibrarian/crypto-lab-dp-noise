name: DP public verification
on:
  push:
    branches: [verification/dp-public-controls-20261012]
permissions:
  contents: read
jobs:
  public-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DP_APPLICATION_SHA: 1a71ad1030045c5ac66c674442823d1bc81ece95
      PUBLIC_DEPLOYMENT_URL: https://systemslibrarian.github.io/crypto-lab-dp-noise/
      DP_EVIDENCE_DIRECTORY: ${{ github.workspace }}/verification-results
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - id: checkout_verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: verifier
          persist-credentials: false
      - id: checkout_app
        uses: actions/checkout@v7
        with:
          ref: 1a71ad1030045c5ac66c674442823d1bc81ece95
          path: app
          persist-credentials: false
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Pin application and verifier identities and import original config
        id: identity
        run: |
          mkdir -p "$DP_EVIDENCE_DIRECTORY"
          node ../verifier/tools/verify-public-deployment.mjs identity
      - name: Positive and negative evidence controls
        id: controls
        run: node --test --test-reporter=tap ../verifier/tools/verify-public-deployment.test.mjs | tee "$DP_EVIDENCE_DIRECTORY/guard-controls.tap"
      - id: install
        run: npm ci --ignore-scripts --no-audit
      - id: browsers
        run: npx playwright install --with-deps chromium
      - name: Strict public URL, bytes and hashes match the original Pages artifact
        id: files
        run: node ../verifier/tools/verify-public-deployment.mjs files
      - name: Discover the full original ten fixtures
        id: discovery
        run: npx playwright test --config playwright.public.config.ts --list --reporter json > "$DP_EVIDENCE_DIRECTORY/public-test-membership.json"
      - name: Original full suite on the public deployment with original budgets
        id: browser
        run: npx playwright test --config playwright.public.config.ts
      - name: Fail closed on all stages, exact original membership and every result
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          DP_STAGE_EVIDENCE: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$DP_EVIDENCE_DIRECTORY"
          printf '%s\n' "$DP_STAGE_EVIDENCE" > "$DP_EVIDENCE_DIRECTORY/workflow-stage-results.json"
          node verifier/tools/verify-public-deployment.mjs report app
      - name: Retain evidence including failed and incomplete reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dp-public-verification-${{ github.sha }}
          path: |
            verification-results
            app/test-results
          if-no-files-found: error
